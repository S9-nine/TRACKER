<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="shell-type" content="mobile_tab"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .material-symbols-outlined.fill { font-variation-settings: 'FILL' 1; }
  </style>
</head>
<body class="bg-[#2B2622]/50 min-h-screen text-[#2B2622] flex flex-col justify-end antialiased relative overflow-hidden">

  <!-- Dimmed background Today context peek -->
  <div class="absolute inset-0 z-0 opacity-40 blur-[1px] pointer-events-none p-5 pt-8 bg-[#F9F9F9]">
    <div class="flex items-center justify-between mb-4">
      <span class="text-xs font-semibold tracking-wider text-[#756F68]">TODAY • OCT 15</span>
      <span class="w-8 h-8 rounded-full bg-stone-200"></span>
    </div>
    <div class="h-8 w-44 bg-stone-300 rounded-lg mb-6"></div>
    <div class="p-4 bg-white rounded-2xl mb-3 shadow-sm border border-stone-200/60">
      <div class="h-5 w-32 bg-stone-200 rounded mb-2"></div>
      <div class="h-3 w-20 bg-stone-100 rounded"></div>
    </div>
    <div class="p-4 bg-white rounded-2xl mb-3 shadow-sm border border-stone-200/60">
      <div class="h-5 w-40 bg-stone-200 rounded mb-2"></div>
      <div class="h-3 w-24 bg-stone-100 rounded"></div>
    </div>
  </div>

  <!-- Tall Bottom Sheet Container -->
  <div class="relative z-10 w-full bg-[#FFFFFF] rounded-t-[32px] shadow-2xl flex flex-col max-h-[92vh] overflow-hidden border-t border-stone-200/70">
    
    <!-- Top Drag Handle -->
    <div class="w-full flex justify-center pt-3 pb-1">
      <div class="w-10 h-1 bg-stone-300 rounded-full"></div>
    </div>

    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-2.5 border-b border-stone-100">
      <h2 class="text-base font-semibold text-[#2B2622]">New Task</h2>
      <button class="w-8 h-8 rounded-full bg-stone-100 flex items-center justify-center text-stone-500 hover:text-stone-800 transition">
        <span class="material-symbols-outlined text-[18px]">close</span>
      </button>
    </div>

    <!-- Sheet Scrollable Content -->
    <div class="overflow-y-auto px-6 py-4 space-y-4">
      
      <!-- Title Input -->
      <div>
        <label class="block text-[11px] font-bold uppercase tracking-wider text-[#756F68] mb-1.5">Task Name</label>
        <div class="relative">
          <input type="text" value="Study DSA 1 hr" class="w-full px-4 py-3 bg-[#F9F9F9] rounded-xl text-[16px] font-semibold text-[#2B2622] border border-stone-200 focus:outline-none focus:border-[#E07A5F]" />
        </div>
      </div>

      <!-- Goal Picker -->
      <div>
        <label class="block text-[11px] font-bold uppercase tracking-wider text-[#756F68] mb-1.5">Linked Goal</label>
        <div class="flex items-center justify-between px-4 py-3 bg-[#F9F9F9] rounded-xl border border-stone-200 cursor-pointer">
          <div class="flex items-center space-x-2.5">
            <span class="w-2.5 h-2.5 rounded-full bg-[#E07A5F]"></span>
            <span class="text-sm font-medium text-[#2B2622]">Crack DSA interviews</span>
          </div>
          <span class="material-symbols-outlined text-stone-400 text-[18px]">expand_more</span>
        </div>
      </div>

      <!-- Day Chips (M T W T F S S) with Mon–Fri selected -->
      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label class="text-[11px] font-bold uppercase tracking-wider text-[#756F68]">Repeat Days</label>
          <span class="text-[11px] font-medium text-[#E07A5F]">Weekdays (5 days)</span>
        </div>
        <div class="grid grid-cols-7 gap-2">
          <!-- Mon: Selected -->
          <button class="h-10 rounded-xl font-semibold text-xs bg-[#E07A5F] text-white shadow-sm flex items-center justify-center">M</button>
          <!-- Tue: Selected -->
          <button class="h-10 rounded-xl font-semibold text-xs bg-[#E07A5F] text-white shadow-sm flex items-center justify-center">T</button>
          <!-- Wed: Selected -->
          <button class="h-10 rounded-xl font-semibold text-xs bg-[#E07A5F] text-white shadow-sm flex items-center justify-center">W</button>
          <!-- Thu: Selected -->
          <button class="h-10 rounded-xl font-semibold text-xs bg-[#E07A5F] text-white shadow-sm flex items-center justify-center">T</button>
          <!-- Fri: Selected -->
          <button class="h-10 rounded-xl font-semibold text-xs bg-[#E07A5F] text-white shadow-sm flex items-center justify-center">F</button>
          <!-- Sat: Unselected -->
          <button class="h-10 rounded-xl font-medium text-xs bg-[#F3F3F3] text-[#756F68] border border-stone-200/50 flex items-center justify-center">S</button>
          <!-- Sun: Unselected -->
          <button class="h-10 rounded-xl font-medium text-xs bg-[#F3F3F3] text-[#756F68] border border-stone-200/50 flex items-center justify-center">S</button>
        </div>
      </div>

      <!-- Time Wheel Picker at 6:00 PM -->
      <div>
        <label class="block text-[11px] font-bold uppercase tracking-wider text-[#756F68] mb-1.5">Alarm Time</label>
        <div class="relative bg-[#F9F9F9] rounded-2xl border border-stone-200 py-2.5 px-6 flex items-center justify-center overflow-hidden">
          <div class="w-full flex items-center justify-around text-center select-none">
            <!-- Hour & Min Wheel Column -->
            <div class="flex flex-col items-center">
              <span class="text-xs text-stone-300 font-medium py-0.5">05 : 45</span>
              <div class="relative py-1 w-24">
                <div class="absolute inset-x-0 top-0 h-[1px] bg-[#E07A5F]/30"></div>
                <span class="text-2xl font-bold text-[#2B2622] tracking-tight">06 : 00</span>
                <div class="absolute inset-x-0 bottom-0 h-[1px] bg-[#E07A5F]/30"></div>
              </div>
              <span class="text-xs text-stone-300 font-medium py-0.5">06 : 15</span>
            </div>
            <!-- AM / PM Column -->
            <div class="flex flex-col items-center">
              <span class="text-xs text-stone-300 font-medium py-0.5">AM</span>
              <div class="relative py-1 px-3">
                <div class="absolute inset-x-0 top-0 h-[1px] bg-[#E07A5F]/30"></div>
                <span class="text-xl font-bold text-[#E07A5F]">PM</span>
                <div class="absolute inset-x-0 bottom-0 h-[1px] bg-[#E07A5F]/30"></div>
              </div>
              <span class="text-xs text-stone-300 font-medium py-0.5">&nbsp;</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Segmented Control: Nudge / Reminder / Alarm -->
      <div>
        <label class="block text-[11px] font-bold uppercase tracking-wider text-[#756F68] mb-1.5">Alert Level</label>
        <div class="grid grid-cols-3 p-1 bg-[#F3F3F3] rounded-xl border border-stone-200/80 gap-1">
          <button class="py-2 rounded-lg text-xs font-medium text-[#756F68] hover:text-[#2B2622] transition">Nudge</button>
          <button class="py-2 rounded-lg text-xs font-medium text-[#756F68] hover:text-[#2B2622] transition">Reminder</button>
          <button class="py-2 rounded-lg text-xs font-semibold bg-[#2B2622] text-white shadow-sm flex items-center justify-center space-x-1">
            <span class="material-symbols-outlined text-[14px] text-[#E07A5F]">alarm</span>
            <span>Alarm</span>
          </button>
        </div>
        <!-- One-line hint below -->
        <p class="text-[12px] text-[#756F68] mt-1.5 flex items-center space-x-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-[#E07A5F]"></span>
          <span>Rings aloud over lock screen until checked or snoozed.</span>
        </p>
      </div>

      <!-- Follow-up Prompt Toggle / Checkbox -->
      <div class="flex items-center justify-between p-3.5 bg-[#FAF8F5] rounded-xl border border-stone-200/70">
        <div class="flex items-center space-x-2.5">
          <div class="w-5 h-5 rounded-md bg-[#E07A5F] flex items-center justify-center text-white">
            <span class="material-symbols-outlined text-[15px]">check</span>
          </div>
          <span class="text-xs font-medium text-[#2B2622]">Ask me if I did it after 15 min</span>
        </div>
        <span class="text-[11px] font-semibold text-[#E07A5F] bg-[#E07A5F]/10 px-2 py-0.5 rounded-full">+15m</span>
      </div>

    </div>

    <!-- Save Button CTA -->
    <div class="p-6 pt-2 pb-7 bg-white border-t border-stone-100">
      <button class="w-full py-3.5 bg-[#E07A5F] hover:bg-[#d66a4f] active:scale-[0.99] text-white font-semibold text-[15px] rounded-2xl shadow-md shadow-[#E07A5F]/25 transition flex items-center justify-center space-x-2">
        <span class="material-symbols-outlined text-[20px]">check_circle</span>
        <span>Save Task</span>
      </button>
    </div>

  </div>

</body>
</html>
