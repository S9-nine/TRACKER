<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "surface": "#f9f9f9", "accent-sage": "#588157", "on-surface-variant": "#55423e", "inverse-primary": "#ffb4a1", "on-background": "#1a1c1c", "on-primary": "#ffffff", "surface-border": "#EAEAE8", "text-muted": "#756F68", "on-error": "#ffffff", "surface-container-lowest": "#ffffff", "surface-container": "#eeeeee", "tertiary": "#645d58", "inverse-on-surface": "#f0f1f1", "on-primary-fixed-variant": "#7c2e19", "on-secondary": "#ffffff", "surface-card": "#FFFFFF", "surface-bright": "#f9f9f9", "secondary-fixed-dim": "#a5d2a2", "surface-variant": "#e2e2e2", "surface-container-high": "#e8e8e8", "primary": "#9a442d", "secondary-fixed": "#c1eebc", "on-tertiary-fixed-variant": "#4c4641", "on-tertiary": "#ffffff", "surface-container-highest": "#e2e2e2", "surface-base": "#FAFAFA", "error": "#ba1a1a", "on-surface": "#1a1c1c", "text-primary": "#2B2622", "surface-subtle": "#F7F7F6", "inverse-surface": "#2f3131", "primary-fixed": "#ffdbd2", "on-primary-fixed": "#3c0800", "secondary": "#406840", "primary-fixed-dim": "#ffb4a1", "on-secondary-container": "#446c44", "primary-container": "#e07a5f", "tertiary-container": "#9d958f", "surface-container-low": "#f3f3f3", "on-tertiary-container": "#332e2a", "background": "#f9f9f9", "outline-variant": "#dbc1ba", "on-tertiary-fixed": "#1f1b17", "on-primary-container": "#5b1604", "tertiary-fixed-dim": "#cec5bf", "secondary-container": "#beecb9", "surface-tint": "#9a442d", "on-secondary-fixed-variant": "#284f2a", "tertiary-fixed": "#ebe1da", "on-error-container": "#93000a", "surface-dim": "#dadada", "error-container": "#ffdad6", "accent-terracotta": "#E07A5F", "on-secondary-fixed": "#002106", "outline": "#88726d" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "margin-mobile": "1.25rem", "space-xs": "0.25rem", "space-xl": "2.25rem", "space-md": "1rem", "gutter": "1rem", "margin": "1.5rem", "space-sm": "0.5rem", "space-lg": "1.5rem", "gutter-mobile": "0.75rem" }, fontFamily: { "label-md": ["Inter"], "body-md": ["Inter"], "body-lg": ["Inter"], "headline-lg": ["Inter"], "headline-sm": ["Inter"], "headline-md": ["Inter"], "display-hero-mobile": ["Inter"], "headline-lg-mobile": ["Inter"], "label-lg": ["Inter"], "display-hero": ["Inter"], "label-sm": ["Inter"], "body-sm": ["Inter"] }, fontSize: { "label-md": ["13px", { lineHeight: "18px", letterSpacing: "0.02em", fontWeight: "600" }], "body-md": ["15px", { lineHeight: "22px", fontWeight: "400" }], "body-lg": ["17px", { lineHeight: "26px", letterSpacing: "-0.005em", fontWeight: "400" }], "headline-lg": ["34px", { lineHeight: "42px", letterSpacing: "-0.02em", fontWeight: "700" }], "headline-sm": ["18px", { lineHeight: "26px", letterSpacing: "-0.01em", fontWeight: "600" }], "headline-md": ["22px", { lineHeight: "30px", letterSpacing: "-0.015em", fontWeight: "600" }], "display-hero-mobile": ["44px", { lineHeight: "52px", letterSpacing: "-0.03em", fontWeight: "700" }], "headline-lg-mobile": ["28px", { lineHeight: "36px", letterSpacing: "-0.02em", fontWeight: "700" }], "label-lg": ["15px", { lineHeight: "20px", letterSpacing: "0.01em", fontWeight: "600" }], "display-hero": ["56px", { lineHeight: "64px", letterSpacing: "-0.03em", fontWeight: "700" }], "label-sm": ["11px", { lineHeight: "16px", letterSpacing: "0.04em", fontWeight: "600" }], "body-sm": ["13px", { lineHeight: "18px", fontWeight: "400" }] } } } }</script><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen selection:bg-primary-fixed selection:text-on-primary-fixed"><main class="flex flex-col relative w-full min-h-screen bg-surface"><div class="flex flex-col w-full relative overflow-hidden select-none" id="alarm-screen">
<!-- Immersive warm dark backdrop container with tactile depth -->
<div class="relative w-full rounded-3xl overflow-hidden px-margin-mobile py-space-xl flex flex-col justify-between items-center shadow-2xl" style="background-color: #1A1714; min-height: 840px;">
<!-- Atmospheric terracotta & amber glowing halos behind time display -->
<div class="absolute -top-12 left-1/2 -translate-x-1/2 w-80 h-80 rounded-full pointer-events-none opacity-20 filter blur-3xl animate-pulse" style="background: radial-gradient(circle, #E07A5F 0%, rgba(224, 122, 95, 0) 70%);"></div>
<div class="absolute top-44 left-1/2 -translate-x-1/2 w-96 h-96 rounded-full pointer-events-none opacity-15 filter blur-3xl" style="background: radial-gradient(circle, #588157 0%, rgba(88, 129, 87, 0) 75%);"></div>
<!-- Top Status Header Area -->
<div class="w-full flex items-center justify-between z-10 pt-space-xs">
<!-- Lockscreen Status Tag -->
<div class="inline-flex items-center gap-space-xs px-space-md py-1.5 rounded-full" style="background-color: rgba(255, 255, 255, 0.06); backdrop-filter: blur(12px);">
<span class="material-symbols-outlined text-sm" style="color: #E07A5F; font-size: 16px;">lock</span>
<span class="font-label-sm text-label-sm tracking-wider uppercase" style="color: #F7F7F6;">Anchor Alarm</span>
<span class="w-1 h-1 rounded-full" style="background-color: #E07A5F;"></span>
<span class="font-label-sm text-label-sm" style="color: #cec5bf;">Now</span>
</div>
<!-- Audible Waveform Micro-indicator -->
<div class="flex items-center gap-1 px-3 py-1.5 rounded-full" style="background-color: rgba(255, 255, 255, 0.06);">
<span class="w-0.5 h-3.5 rounded-full animate-bounce" style="background-color: #E07A5F; animation-duration: 0.8s;"></span>
<span class="w-0.5 h-5 rounded-full animate-bounce" style="background-color: #E07A5F; animation-duration: 1.1s;"></span>
<span class="w-0.5 h-2.5 rounded-full animate-bounce" style="background-color: #E07A5F; animation-duration: 0.6s;"></span>
<span class="w-0.5 h-4 rounded-full animate-bounce" style="background-color: #E07A5F; animation-duration: 0.9s;"></span>
</div>
</div>
<!-- Centerpiece: Pulsing Ambient Ring + Monumental Time + Main Task Card -->
<div class="w-full flex flex-col items-center text-center my-auto z-10 relative">
<!-- Pulsing Ambient Geometric Concentric Rings -->
<div class="relative flex items-center justify-center my-2">
<div class="absolute w-72 h-72 rounded-full pointer-events-none opacity-20 animate-ping" style="border: 1px solid #E07A5F; animation-duration: 3.5s;"></div>
<div class="absolute w-80 h-80 rounded-full pointer-events-none opacity-10" style="border: 1.5px dashed #FAF6F1;"></div>
<!-- Ultra-bold, Pristine Monumental Time -->
<div class="relative flex flex-col items-center">
<div class="font-display-hero-mobile text-display-hero-mobile tracking-tighter drop-shadow-md" style="font-size: 72px; line-height: 76px; color: #FAF6F1; font-weight: 800;">
            6:00
          </div>
<div class="font-label-md text-label-md tracking-widest uppercase mt-1" style="color: #cec5bf; letter-spacing: 0.25em;">
            PM • Wednesday
          </div>
</div>
</div>
<!-- Main Focus Task Floating Plaque -->
<div class="w-full mt-8 rounded-3xl p-space-lg flex flex-col items-center relative overflow-hidden shadow-xl" style="background-color: #241F1B; box-shadow: 0 16px 36px -8px rgba(0, 0, 0, 0.5);">
<!-- Subtle tactile inner accent glow -->
<div class="absolute -right-8 -top-8 w-28 h-28 rounded-full pointer-events-none opacity-10" style="background-color: #E07A5F; filter: blur(20px);"></div>
<!-- Goal Association Badge -->
<div class="inline-flex items-center gap-space-xs px-3.5 py-1 rounded-full mb-3" style="background-color: #2F2823; box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.05);">
<span class="material-symbols-outlined text-xs" style="color: #588157; font-size: 15px; font-variation-settings: 'FILL' 1;">flag</span>
<span class="font-label-sm text-label-sm font-semibold tracking-wide" style="color: #c1eebc;">Crack DSA interviews</span>
</div>
<!-- Task Title -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile tracking-tight text-center" style="color: #FFFFFF; font-weight: 700;">
          Study DSA 1 hr
        </h1>
<p class="font-body-sm text-body-sm mt-1 max-w-xs text-center" style="color: #cec5bf;">
          Binary Trees & Dynamic Programming deep-work sprint
        </p>
<!-- Snooze Usage Counter Indicator -->
<div class="mt-4 pt-3 flex items-center justify-center gap-2 w-full" style="border-top: 1px solid rgba(255, 255, 255, 0.06);">
<span class="font-label-sm text-label-sm" style="color: #9d958f;">Snoozed <span id="snooze-count" style="color: #FAF6F1; font-weight: 700;">0</span> of 3</span>
<div class="flex items-center gap-1.5 ml-1">
<span class="w-2 h-2 rounded-full transition-all duration-300" id="snooze-dot-1" style="background-color: rgba(255, 255, 255, 0.15);"></span>
<span class="w-2 h-2 rounded-full transition-all duration-300" id="snooze-dot-2" style="background-color: rgba(255, 255, 255, 0.15);"></span>
<span class="w-2 h-2 rounded-full transition-all duration-300" id="snooze-dot-3" style="background-color: rgba(255, 255, 255, 0.15);"></span>
</div>
</div>
</div>
<!-- Quick Context Stat Strip -->
<div class="flex items-center justify-between w-full mt-4 px-2">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined" style="color: #588157; font-size: 18px;">local_fire_department</span>
<span class="font-label-sm text-label-sm" style="color: #cec5bf;">Day 12 streak alive</span>
</div>
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined" style="color: #E07A5F; font-size: 18px;">schedule</span>
<span class="font-label-sm text-label-sm" style="color: #cec5bf;">Target: 7:00 PM finish</span>
</div>
</div>
</div>
<!-- Stacked Action Controls Section (Strict Android Priority Stack) -->
<div class="w-full flex flex-col gap-3 z-20 pb-safe mt-6">
<!-- 1. Top of stack: Minimal Outline / Ghost "Skip" Button -->
<button class="w-full h-12 rounded-full flex items-center justify-center transition-all duration-150 active:scale-[0.98]" id="btn-skip" style="background-color: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.12);" type="button">
<span class="font-label-md text-label-md tracking-wide" style="color: #cec5bf;">Skip this session</span>
</button>
<!-- 2. Middle of stack: Secondary Pill "Snooze 10 min" Button -->
<button class="w-full h-14 rounded-full flex items-center justify-center gap-2 transition-all duration-150 active:scale-[0.98] shadow-md" id="btn-snooze" style="background-color: #2C2622;" type="button">
<span class="material-symbols-outlined" style="color: #FAF6F1; font-size: 20px;">snooze</span>
<span class="font-label-lg text-label-lg font-semibold tracking-wide" style="color: #FAF6F1;">Snooze 10 min</span>
</button>
<!-- 3. Bottom of stack: Primary Hero Terracotta "Done" Button -->
<button class="w-full h-16 rounded-full flex items-center justify-center gap-2.5 transition-all duration-150 active:scale-[0.98]" id="btn-done" style="background-color: #E07A5F; box-shadow: 0 8px 24px -2px rgba(224, 122, 95, 0.45);" type="button">
<span class="material-symbols-outlined" style="color: #FFFFFF; font-size: 26px; font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-headline-sm text-headline-sm font-bold text-white tracking-wide">Done • Start Study</span>
</button>
</div>
<!-- Interactive Feedback Toast Overlay -->
<div class="absolute bottom-8 left-1/2 -translate-x-1/2 w-11/12 py-3 px-4 rounded-2xl flex items-center justify-center gap-2 z-30 opacity-0 pointer-events-none transition-all duration-300 translate-y-3" id="alarm-toast" style="background-color: #2F2823; box-shadow: 0 10px 30px rgba(0,0,0,0.6);">
<span class="material-symbols-outlined text-accent-sage" id="toast-icon" style="font-size: 20px;">task_alt</span>
<span class="font-label-md text-label-md" id="toast-message" style="color: #FAF6F1;">Focus mode initiated!</span>
</div>
</div>
</div>
<script>
  (function () {
    var snoozeCount = 0;
    var maxSnoozes = 3;
    var snoozeBtn = document.getElementById('btn-snooze');
    var skipBtn = document.getElementById('btn-skip');
    var doneBtn = document.getElementById('btn-done');
    var countLabel = document.getElementById('snooze-count');
    var toast = document.getElementById('alarm-toast');
    var toastMsg = document.getElementById('toast-message');
    var toastIcon = document.getElementById('toast-icon');

    function triggerToast(message, iconName, color) {
      toastMsg.textContent = message;
      toastIcon.textContent = iconName;
      toastIcon.style.color = color || '#588157';
      toast.style.opacity = '1';
      toast.style.transform = 'translate(-50%, -12px)';
      setTimeout(function () {
        toast.style.opacity = '0';
        toast.style.transform = 'translate(-50%, 12px)';
      }, 2400);
    }

    if (snoozeBtn) {
      snoozeBtn.addEventListener('click', function () {
        if (snoozeCount < maxSnoozes) {
          snoozeCount++;
          countLabel.textContent = snoozeCount;
          var dot = document.getElementById('snooze-dot-' + snoozeCount);
          if (dot) {
            dot.style.backgroundColor = '#E07A5F';
            dot.style.boxShadow = '0 0 8px #E07A5F';
          }
          triggerToast('Snoozed until 6:10 PM', 'alarm_on', '#ffb4a1');
        } else {
          triggerToast('Maximum snoozes reached', 'warning', '#ba1a1a');
        }
      });
    }

    if (skipBtn) {
      skipBtn.addEventListener('click', function () {
        triggerToast('Session skipped. Rescheduling tomorrow.', 'event_busy', '#cec5bf');
      });
    }

    if (doneBtn) {
      doneBtn.addEventListener('click', function () {
        triggerToast('Ritual started! 60-min timer running.', 'verified', '#c1eebc');
      });
    }
  })();
</script></main></body></html>
